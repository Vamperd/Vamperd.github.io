---
layout: default
---
<div id="main" role="main">
  {% include sidebar.html %}
  <article class="portfolio-shell portfolio-shell--page" id="main-content">
    <header class="page-intro">
      <p class="eyebrow">{{ page.kicker }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.lead %}<p class="page-intro__lead">{{ page.lead }}</p>{% endif %}
    </header>
    <div class="story-content">
      {{ content }}
    </div>
  </article>
</div>
