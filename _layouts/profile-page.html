---
layout: default
---
<main class="portfolio-shell portfolio-shell--page" id="main-content">
  <header class="page-intro">
    <p class="eyebrow">{{ page.kicker }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-intro__lead">{{ page.lead }}</p>{% endif %}
  </header>
  <article class="story-content">
    {{ content }}
  </article>
</main>
