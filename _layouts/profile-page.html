---
layout: default
---
<div id="main" role="main">
  {% include sidebar.html %}
  <article class="portfolio-shell portfolio-shell--page" id="main-content">
    <header class="page-intro">
      <p class="eyebrow">{{ page.kicker }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.lead %}<p class="page-intro__lead">{{ page.lead }}</p>{% endif %}
    </header>
    <div class="story-content">
      {{ content }}
      {% if page.lang == 'zh' and page.url == '/zh/build/' %}
      <div class="media-gallery" aria-label="Project demonstrations">
        <figure><img src="{{ '/images/project_sentrymatch.gif' | relative_url }}" alt="Autonomous sentry robot demonstration" loading="lazy"></figure>
        <figure><img src="{{ '/images/project_dartmatch.gif' | relative_url }}" alt="Vision-guided dart system demonstration" loading="lazy"></figure>
        <figure><img src="{{ '/images/project_dart_record.png' | relative_url }}" alt="Dart system flight record" loading="lazy"></figure>
        <figure><img src="{{ '/images/project_dart_record_2.png' | relative_url }}" alt="Detailed dart system flight record" loading="lazy"></figure>
      </div>
      {% elsif page.lang == 'zh' and page.url == '/zh/research/' %}
      <div class="media-gallery" aria-label="Research visualizations">
        <figure><img src="{{ '/images/reserach_multitask_2.png' | relative_url }}" alt="Multi-robot coordination strategy" loading="lazy"></figure>
        <figure><img src="{{ '/images/reserach_SciKnowEval.png' | relative_url }}" alt="SciKnowEval framework" loading="lazy"></figure>
      </div>
      {% endif %}
    </div>
  </article>
</div>
